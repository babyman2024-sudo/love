<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>صندوقچه دلتنگی و خاطرات</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --gold: #f5d09b;
            --gold-bright: #fff5e6;
            --rose: #ff9ebb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #12050e;
            color: #fff;
            user-select: none;
            -webkit-user-select: none;
        }

        #start-gate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%; height: 100dvh;
            background: radial-gradient(circle at center, #2d0e20 0%, #12050e 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            cursor: pointer;
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), visibility 1.2s ease;
        }

        .orb-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
            transform-style: preserve-3d;
            transition: transform 0.2s ease-out;
            pointer-events: none;
        }

        .orb-outer-glow {
            position: absolute;
            top: -30px; left: -30px; right: -30px; bottom: -30px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 158, 187, 0.5) 0%, rgba(245, 208, 155, 0.3) 45%, transparent 70%);
            filter: blur(20px);
            animation: glowBreathe 3.5s infinite ease-in-out;
        }

        .crystal-orb {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, 
                rgba(255, 255, 255, 0.95) 0%, 
                rgba(255, 215, 230, 0.6) 25%, 
                rgba(245, 208, 155, 0.45) 50%, 
                rgba(209, 88, 122, 0.4) 75%, 
                rgba(40, 10, 25, 0.9) 100%);
            box-shadow: 
                inset 0 0 25px rgba(255, 255, 255, 0.9),
                inset -10px -10px 30px rgba(255, 158, 187, 0.7),
                inset 10px 10px 25px rgba(245, 208, 155, 0.6),
                0 0 40px rgba(255, 158, 187, 0.6),
                0 0 70px rgba(245, 208, 155, 0.4);
            backdrop-filter: blur(6px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: orbFloat 4s infinite ease-in-out;
            position: relative;
        }

        .orb-core {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, #ff9ebb 40%, #d1587a 75%, transparent 100%);
            box-shadow: 0 0 25px #ff9ebb, 0 0 40px #f5d09b;
            animation: heartbeatPulse 1.8s infinite ease-in-out;
        }

        .orb-ring-1 {
            position: absolute;
            top: -10px; left: -10px; right: -10px; bottom: -10px;
            border: 1.5px dashed rgba(245, 208, 155, 0.8);
            border-radius: 50%;
            animation: rotateClockwise 14s linear infinite;
        }

        .orb-ring-2 {
            position: absolute;
            top: -20px; left: -20px; right: -20px; bottom: -20px;
            border: 1.5px solid rgba(255, 158, 187, 0.5);
            border-radius: 50%;
            animation: rotateAntiClockwise 18s linear infinite;
        }

        .gate-hint {
            margin-top: 35px;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--gold-bright);
            letter-spacing: 1.5px;
            animation: textGlow 2.5s infinite ease-in-out;
            pointer-events: none;
            text-align: center;
            padding: 0 15px;
        }

        .orb-shatter {
            animation: shatter 1s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes glowBreathe {
            0%, 100% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        @keyframes heartbeatPulse {
            0%, 100% { transform: scale(0.85); opacity: 0.85; }
            15% { transform: scale(1.25); opacity: 1; }
            30% { transform: scale(0.95); opacity: 0.9; }
            45% { transform: scale(1.35); opacity: 1; }
        }

        @keyframes rotateClockwise {
            from { transform: rotate(0deg); } to { transform: rotate(360deg); }
        }

        @keyframes rotateAntiClockwise {
            from { transform: rotate(360deg); } to { transform: rotate(0deg); }
        }

        @keyframes textGlow {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; text-shadow: 0 0 20px var(--gold); }
        }

        @keyframes shatter {
            0% { transform: scale(1); }
            40% { transform: scale(1.3); filter: brightness(3); }
            100% { transform: scale(4); opacity: 0; filter: blur(20px); }
        }

        .loop-video {
            position: fixed;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            transform: translate(-50%, -50%);
            z-index: 1;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.8s ease-in-out, filter 1.5s ease;
        }

        .active-video { opacity: 1 !important; }

        .ambient-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%; height: 100dvh;
            background: radial-gradient(circle at center, rgba(35, 12, 25, 0.1) 0%, rgba(10, 2, 8, 0.55) 100%);
            z-index: 2;
            pointer-events: none;
        }

        #fx-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%; height: 100dvh;
            z-index: 15;
            pointer-events: none;
        }

        .login-wrapper {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%; height: 100dvh;
            display: flex; justify-content: center; align-items: center;
            z-index: 10;
            padding: 20px;
            transition: opacity 0.5s ease;
        }

        .romantic-card {
            background: rgba(255, 245, 240, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            border-top: 2px solid rgba(245, 208, 155, 0.9);
            border-radius: 28px;
            padding: 35px 25px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(245, 208, 155, 0.3);
            opacity: 0;
            transform: scale(0.85) translateY(20px);
            transition: all 1.5s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .romantic-card.active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .text-3d-title {
            color: var(--gold-bright);
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 6px;
            text-shadow: 0 1px 0 #d19a58, 0 2px 0 #b37e3d, 0 0 15px rgba(245, 208, 155, 0.6);
        }

        .text-3d-sub {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 22px;
            line-height: 1.5;
        }

        .input-group input {
            width: 100%;
            padding: 13px 16px;
            margin-bottom: 18px;
            background: rgba(0, 0, 0, 0.4);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            color: white;
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input:focus { 
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(245, 208, 155, 0.4);
        }

        button.btn-unlock {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, rgba(245, 208, 155, 0.4), rgba(255, 158, 187, 0.5));
            border: 1.5px solid var(--gold);
            border-radius: 20px;
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        button.btn-unlock:active {
            transform: scale(0.97);
        }

        .audio-ctrl {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 25;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 7px 14px;
            border-radius: 18px;
            font-size: 0.8rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="start-gate">
        <div class="orb-wrapper" id="orb-wrapper">
            <div class="orb-outer-glow"></div>
            <div class="crystal-orb" id="crystal-orb">
                <div class="orb-core"></div>
                <div class="orb-ring-1"></div>
                <div class="orb-ring-2"></div>
            </div>
        </div>
        <div class="gate-hint">برای گشودن دریچه، گوی را لمس کنید ✨</div>
    </div>

    <video id="bg-video-1" class="loop-video active-video" playsinline webkit-playsinline muted preload="auto">
        <source src="./login.mp4" type="video/mp4">
    </video>
    <video id="bg-video-2" class="loop-video" playsinline webkit-playsinline muted preload="auto">
        <source src="./login.mp4" type="video/mp4">
    </video>

    <div class="ambient-overlay"></div>
    <canvas id="fx-canvas"></canvas>

    <div class="login-wrapper" id="login-wrapper">
        <div class="romantic-card" id="login-card">
            <h2 class="text-3d-title">صندوقچه دلتنگی</h2>
            <p class="text-3d-sub">برای مرور ناگفته‌ها و خاطرات مشترکمان</p>
            <div class="input-group">
                <input type="password" id="pwd-input" placeholder="کلید واژه دلتنگی..." autocomplete="off">
            </div>
            <button class="btn-unlock" id="btn-unlock">گشودن بال خاطرات</button>
        </div>
    </div>

    <button class="audio-ctrl" id="audio-btn">🔊 صدا: روشن</button>

    <script>
        const v1 = document.getElementById('bg-video-1');
        const v2 = document.getElementById('bg-video-2');
        const startGate = document.getElementById('start-gate');
        const orbWrapper = document.getElementById('orb-wrapper');
        const crystalOrb = document.getElementById('crystal-orb');
        const loginCard = document.getElementById('login-card');
        const loginWrapper = document.getElementById('login-wrapper');
        const pwdInput = document.getElementById('pwd-input');
        const btnUnlock = document.getElementById('btn-unlock');
        const audioBtn = document.getElementById('audio-btn');

        const SECRET_KEY = "raha";

        // پشتیبانی ژیروسکوپ / حرکت موس
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                if (e.gamma && e.beta) {
                    const x = Math.min(Math.max(e.gamma / 3, -15), 15);
                    const y = Math.min(Math.max(e.beta / 4, -15), 15);
                    orbWrapper.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
                }
            });
        }
        startGate.addEventListener('mousemove', (e) => {
            const rect = startGate.getBoundingClientRect();
            const x = (e.clientX - rect.width / 2) / 12;
            const y = (e.clientY - rect.height / 2) / 12;
            orbWrapper.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
        });

        let gateOpened = false;
        function openGate() {
            if (gateOpened) return;
            gateOpened = true;

            crystalOrb.classList.add('orb-shatter');

            v1.muted = false;
            v1.volume = 0.85;
            
            const playPromise = v1.play();
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    v1.muted = true;
                    v1.play().catch(() => {});
                });
            }

            setTimeout(() => {
                startGate.style.opacity = '0';
                setTimeout(() => startGate.style.visibility = 'hidden', 1000);
            }, 400);

            setTimeout(() => {
                if (!isFormActive) {
                    isFormActive = true;
                    assembleFormParticles();
                }
            }, 6500);
        }

        startGate.addEventListener('click', openGate);
        startGate.addEventListener('touchend', openGate);

        const appearTime = 6.5;
        const loopStart = 6.8;
        const loopEnd = 9.2;
        const fadeDuration = 0.8;

        let isFormActive = false;
        let isUnlocked = false;
        let currentVid = v1;
        let nextVid = v2;

        function handleSeamlessLoop(e) {
            const vid = e.target;
            if (vid.currentTime >= appearTime && !isFormActive) {
                isFormActive = true;
                assembleFormParticles();
            }

            if (isFormActive && !isUnlocked && vid === currentVid) {
                if (currentVid.currentTime >= (loopEnd - fadeDuration) && !currentVid.isFading) {
                    currentVid.isFading = true;
                    nextVid.currentTime = loopStart;
                    nextVid.play().then(() => {
                        nextVid.classList.add('active-video');
                        currentVid.classList.remove('active-video');
                        setTimeout(() => {
                            currentVid.pause();
                            currentVid.isFading = false;
                            const temp = currentVid;
                            currentVid = nextVid;
                            nextVid = temp;
                        }, fadeDuration * 1000);
                    }).catch(() => {});
                }
            }
        }

        v1.addEventListener('timeupdate', handleSeamlessLoop);
        v2.addEventListener('timeupdate', handleSeamlessLoop);

        audioBtn.addEventListener('click', () => {
            if (v1.muted) {
                v1.muted = false;
                audioBtn.innerText = "🔊 صدا: روشن";
            } else {
                v1.muted = true;
                audioBtn.innerText = "🔇 صدا: خاموش";
            }
        });

        btnUnlock.addEventListener('click', () => {
            if (pwdInput.value.trim() !== SECRET_KEY) {
                loginCard.style.transform = 'translateY(0) scale(1) translateX(10px)';
                setTimeout(() => loginCard.style.transform = 'translateY(0) scale(1) translateX(-10px)', 70);
                setTimeout(() => loginCard.style.transform = 'translateY(0) scale(1) translateX(10px)', 140);
                setTimeout(() => loginCard.style.transform = 'translateY(0) scale(1) translateX(0)', 210);
                pwdInput.style.borderColor = '#ff6b81';
                pwdInput.placeholder = 'رمز اشتباه است...';
                pwdInput.value = '';
                setTimeout(() => {
                    pwdInput.style.borderColor = 'rgba(255, 255, 255, 0.25)';
                    pwdInput.placeholder = 'کلید واژه دلتنگی...';
                }, 1500);
            } else {
                isUnlocked = true;
                loginWrapper.style.opacity = '0';
                setTimeout(() => loginWrapper.style.display = 'none', 500);

                spawnButterfliesBurst();

                setTimeout(() => {
                    v1.style.filter = "blur(10px) brightness(0.4)";
                    v2.style.filter = "blur(10px) brightness(0.4)";
                    setTimeout(() => {
                        window.location.href = "./memories.html";
                    }, 1000);
                }, 800);
            }
        });

        pwdInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') btnUnlock.click();
        });

        const canvas = document.getElementById('fx-canvas');
        const ctx = canvas.getContext('2d');
        let butterflies = [];
        let sparkles = [];
        let formParticles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class FormParticle {
            constructor(targetX, targetY) {
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 350 + 150;
                this.x = targetX + Math.cos(angle) * distance;
                this.y = targetY + Math.sin(angle) * distance;
                this.targetX = targetX;
                this.targetY = targetY;
                this.size = Math.random() * 3 + 1.5;
                this.speed = Math.random() * 0.06 + 0.035;
                this.color = Math.random() > 0.4 ? '#f5d09b' : '#ff9ebb';
            }
            update() {
                this.x += (this.targetX - this.x) * this.speed;
                this.y += (this.targetY - this.y) * this.speed;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
            }
        }

        function assembleFormParticles() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const w = Math.min(340, canvas.width - 40);
            const h = 280;

            for (let i = 0; i < 200; i++) {
                let tx, ty;
                if (Math.random() > 0.5) {
                    tx = cx - w/2 + Math.random() * w;
                    ty = Math.random() > 0.5 ? cy - h/2 : cy + h/2;
                } else {
                    tx = Math.random() > 0.5 ? cx - w/2 : cx + w/2;
                    ty = cy - h/2 + Math.random() * h;
                }
                formParticles.push(new FormParticle(tx, ty));
            }

            setTimeout(() => {
                loginCard.classList.add('active');
                pwdInput.focus();
                setTimeout(() => { formParticles = []; }, 1000);
            }, 1200);
        }

        class Butterfly {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 3;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed - 1.5;
                this.size = Math.random() * 7 + 5;
                this.wingAngle = 0;
                this.wingSpeed = Math.random() * 0.3 + 0.2;
                this.opacity = 1;
                this.life = 0;
                this.maxLife = Math.random() * 100 + 80;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.wingAngle += this.wingSpeed;
                this.life++;
                if (this.life > this.maxLife - 35) this.opacity -= 0.03;
            }
            draw() {
                if (this.opacity <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(Math.atan2(this.vy, this.vx) + Math.PI / 2);
                ctx.globalAlpha = Math.max(0, this.opacity);
                const wingWidth = Math.abs(Math.sin(this.wingAngle)) * this.size;
                ctx.shadowBlur = 12;
                ctx.shadowColor = "#f5d09b";
                ctx.fillStyle = "rgba(245, 208, 155, 0.95)";
                ctx.beginPath();
                ctx.ellipse(wingWidth / 2, 0, wingWidth / 2, this.size, 0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(-wingWidth / 2, 0, wingWidth / 2, this.size, -0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Sparkle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.size = Math.random() * 3 + 1;
                this.opacity = 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.96;
                this.vy *= 0.96;
                this.opacity -= 0.015;
            }
            draw() {
                if (this.opacity <= 0) return;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(245, 208, 155, ${this.opacity})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = "#ff9ebb";
                ctx.fill();
            }
        }

        function spawnButterfliesBurst() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            for (let i = 0; i < 70; i++) butterflies.push(new Butterfly(centerX, centerY));
            for (let i = 0; i < 120; i++) sparkles.push(new Sparkle(centerX, centerY));
        }

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < formParticles.length; i++) {
                formParticles[i].update();
                formParticles[i].draw();
            }
            for (let i = sparkles.length - 1; i >= 0; i--) {
                sparkles[i].update();
                sparkles[i].draw();
                if (sparkles[i].opacity <= 0) sparkles.splice(i, 1);
            }
            for (let i = butterflies.length - 1; i >= 0; i--) {
                butterflies[i].update();
                butterflies[i].draw();
                if (butterflies[i].opacity <= 0) butterflies.splice(i, 1);
            }
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
